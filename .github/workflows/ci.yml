name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Installs packages on GitHub's servers (not on your computer).
      # --ignore-scripts blocks install-time scripts from dependencies.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # `next build` also type-checks every file.
      - name: Build
        run: npm run build
